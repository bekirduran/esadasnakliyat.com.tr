name: Verify and deploy to Cloudflare
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --env staging
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f43c3868d602be8f12dc0f0a8c0e2636
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::CLOUDFLARE_API_TOKEN is missing. Verification passed; deployment was NOT performed.'
            echo 'Deployment pending: add repository secret CLOUDFLARE_API_TOKEN, then re-run this workflow.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.configured == 'true'
        run: npm ci
      - if: steps.credentials.outputs.configured == 'true'
        run: npm run build
      - name: Apply environment database migrations
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
      - name: Deploy environment
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler deploy --env "$DEPLOY_ENV"
      - name: Verify deployed environment
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          node scripts/smoke-deployment.mjs "$DEPLOY_ENV"
